# Builds EasyChange.exe on Windows, tests it, and attaches it to GitHub Releases.
#
# - Every push to main / pull request: run tests + build + self-test. The zip is
#   downloadable from the run's "Artifacts" section for 30 days.
# - Publishing a Release on GitHub: the same, then the zip is attached to the
#   Release as EasyChange-windows.zip.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write  # needed to attach the zip to a Release
    env:
      PYTHON: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest tests -q

      - name: Build EasyChange.exe
        run: powershell -ExecutionPolicy Bypass -File build.ps1

      - name: Self-test the built exe
        shell: pwsh
        run: |
          $report = Join-Path $PWD "selftest.txt"
          # It's a windowed app, so start it and wait for its exit code.
          $p = Start-Process -FilePath "dist\EasyChange\EasyChange.exe" `
                 -ArgumentList "--selftest", "`"$report`"" -Wait -PassThru
          if (Test-Path $report) { Get-Content $report }
          if ($p.ExitCode -ne 0) { throw "Self-test failed (exit code $($p.ExitCode))" }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\EasyChange -DestinationPath EasyChange-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: EasyChange-windows
          path: EasyChange-windows.zip
          retention-days: 30

      - name: Attach to the Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" EasyChange-windows.zip --clobber
